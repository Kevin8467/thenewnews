---
layout: default
---

<article class="post">
  <header class="post-header">
    <div class="post-meta">
      <span class="post-county">📍 {{ page.county }}</span>
      <span class="post-date">{{ page.date | date: "%Y 年 %m 月 %d 日" }}</span>
      {% if page.categories %}
        {% for cat in page.categories %}
          <span class="post-category">{{ cat }}</span>
        {% endfor %}
      {% endif %}
    </div>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ '/' | relative_url }}" class="back-link">← 回到首頁</a>
  </footer>
</article>
